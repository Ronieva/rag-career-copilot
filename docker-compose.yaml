version: "3.9"

services:
  api:
    build: .
    container_name: rag-career-copilot-api
    ports:
      - "8000:8000"
    environment:
      # You can set these here or use a .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      - VECTOR_DIR=/app/vector_db
    volumes:
      # Persist Chroma locally
      - ./vector_db:/app/vector_db
    restart: unless-stopped
